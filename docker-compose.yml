services:
  app:
    build: 
      context: ./site
    container_name: app-cont

    ports:
      - "5000:8080"

    environment:
      APP_NAME: DockerOps Dashboard
      APP_ENV: production
      APP_VERSION: "1.0.0"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    restart: unless-stopped
