<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{{ app_name }}</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #0f172a;
            color: #e2e8f0;
            padding: 40px 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        .header {
            margin-bottom: 35px;
        }

        .badge {
            display: inline-block;
            padding: 7px 14px;
            border-radius: 20px;
            background: #064e3b;
            color: #6ee7b7;
            font-size: 13px;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #94a3b8;
            font-size: 17px;
        }

        .status-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .status {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: bold;
        }

        .dot {
            width: 13px;
            height: 13px;
            background: #22c55e;
            border-radius: 50%;
            box-shadow: 0 0 12px #22c55e;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 18px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 22px;
            transition: transform 0.2s ease;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: #64748b;
        }

        .label {
            color: #94a3b8;
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .value {
            font-size: 19px;
            font-weight: bold;
            word-break: break-word;
        }

        .footer {
            margin-top: 35px;
            text-align: center;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 32px;
            }

            body {
                padding: 25px 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="badge">● DOCKERIZED APPLICATION</div>

        <h1>{{ app_name }}</h1>

        <p class="subtitle">
            A production-style Flask application running inside a container.
        </p>
    </div>

    <div class="status-card">

        <div class="status">
            <span class="dot"></span>
            Application is running
        </div>

    </div>

    <div class="grid">

        <div class="card">
            <div class="label">Environment</div>
            <div class="value">{{ environment }}</div>
        </div>

        <div class="card">
            <div class="label">Version</div>
            <div class="value">v{{ version }}</div>
        </div>

        <div class="card">
            <div class="label">Container Hostname</div>
            <div class="value">{{ hostname }}</div>
        </div>

        <div class="card">
            <div class="label">Server Time</div>
            <div class="value">{{ time }}</div>
        </div>

    </div>

    <div class="footer">
        Built with Flask • Containerized with Docker
    </div>

</div>

</body>
</html>
